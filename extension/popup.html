<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Send-to-anything</title>
  <style>
    :root {
      --bg: #0f172a;
      --item-bg: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .search-box {
      margin-bottom: 10px;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .palette-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
    }

    .palette-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--item-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .palette-item:hover,
    .palette-item.selected {
      border-color: var(--primary);
      background: #25334d;
    }

    .palette-item-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .palette-name {
      font-weight: 500;
      color: #f8fafc;
    }

    .palette-cmd {
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
    }

    .palette-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .chip {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      background: #334155;
      color: #cbd5e1;
    }

    .chip-key {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .empty-state {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="search-box">
    <input type="text" id="filterInput" placeholder="Type a command or filter profiles..." autofocus>
  </div>

  <div class="palette-list" id="paletteList"></div>

  <div class="footer">
    <span>↑↓ navigate &bull; ↵ run</span>
    <a id="openOptionsLink">⚙️ Manage Profiles</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
